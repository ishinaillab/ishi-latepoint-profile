name: PHP checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Test address adapter
        run: php tests/address-adapter-test.php

      - name: Test in-place address navigation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
          node --check assets/address-navigation.js
          node --test tests/address-navigation.test.cjs
