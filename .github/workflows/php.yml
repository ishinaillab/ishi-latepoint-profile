name: PHP checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Test address adapter
        run: php tests/profile-adapter-test.php

      - name: Test in-place address navigation
        run: |
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0 jquery@3.7.1
          node --check assets/shortcode-ui.js
          node --test tests/address-navigation.test.cjs tests/dropdown-scheme.test.cjs tests/shortcode-ui.test.cjs

      - name: Test address form in Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
          node tests/address-browser.cjs
          node tests/profile-browser.cjs
